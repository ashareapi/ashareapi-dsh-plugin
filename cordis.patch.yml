# ashareapi-dsh-plugin — bundle patch
#
# 由 `dsh plugin --profile web add ashareapi-dsh-plugin` 安装时应用：
# 在当前 profile 里插入一个条目，指向本包的 Cordis 插件（index.js）。
# 插件内部再把 @deepseek-ai/dsh-mcp-client 挂上，指向 A股数据 API 的 MCP 端点，
# 于是 31 个 A股工具会以 mcp__ashareapi__<工具名> 的形式出现在模型面前。
#
# 想填 API Key：不要改这个文件，改 profile 的 cordis.patch.yml，在下面这条
# 条目下加 config（见 README「配置」）。也可以直接用环境变量 ASHAREAPI_KEY。
- insert:
    - id: mcp-ashareapi
      name: ashareapi-dsh-plugin
